[FilterPlugin]
; Additional files packaged with the plugin, beyond what BuildPlugin copies by
; default (Source/, Config/, Resources/, Content/, the .uplugin). Paths are
; relative to the plugin root and may use "...", "*" and "?" wildcards.
;
; The Example/ host project and Tools/ scripts are development-only: they are
; outside the default set and not listed here, so they are not distributed.
