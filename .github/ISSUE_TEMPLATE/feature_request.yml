name: Feature request
description: Suggest an improvement or missing capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If the official convex-js client already has this, link to it. Protocol-level requests usually belong in convex-cpp, which this plugin vendors.
